<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 Internal Server Error | Nilite Exports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      background: #0a2230;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }
    .error-card {
      background: rgba(15, 34, 48, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 900;
      color: #ef4444;
      margin: 0;
      line-height: 1;
    }
    .error-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin: 1rem 0 0.5rem 0;
      color: #ffffff;
    }
    .error-desc {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #059669, #047857);
      color: #ffffff;
      padding: 0.85rem 1.8rem;
      border-radius: 50px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(5, 150, 105, 0.4);
      transition: transform 0.2s;
    }
    .btn-home:hover {
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div style="font-size: 3rem; margin-bottom: 0.5rem;">⚙️</div>
    <div class="error-code">500</div>
    <h1 class="error-title">Server Maintenance</h1>
    <p class="error-desc">
      Our trade portal server encountered a temporary connection issue. Our engineering team has been notified. Please try refreshing or reach our export desk directly on WhatsApp.
    </p>
    <a href="index.html" class="btn-home">
      &larr; Return to Official Portal
    </a>
  </div>

</body>
</html>
